<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول · LEVEL UP</title>
<link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
<link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/theme.js"></script>
</head>
<body>

<!-- زرار الثيم العائم (صفحة الدخول بس، باقي الصفحات الزرار في السايدبار) -->
<button type="button" class="theme-toggle" id="themeToggle" aria-label="تفعيل الوضع الفاتح" title="تفعيل الوضع الفاتح">
  <span class="theme-icon when-dark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
  <span class="lbl when-dark">الوضع الفاتح</span>
  <span class="theme-icon when-light"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span>
  <span class="lbl when-light">الوضع الداكن</span>
</button>

<main class="login-wrap">
  <form class="login" method="post" action="../Dashboard/Single.html"
        asp-controller="Account" asp-action="Login" autocomplete="off" novalidate>

    <div class="top">
      <div class="logo"><img src="../images/logo.svg" alt="" width="36" height="36"></div>
      <h1>LEVEL UP</h1>
      <p class="sub">سجّل دخولك لإدارة الأجهزة والجلسات</p>
    </div>

    <!-- رسالة غلط الدخول (ModelState.AddModelError("", "...")) -->
    <div class="validation-summary-valid" data-valmsg-summary="true" asp-validation-summary="ModelOnly"><ul></ul></div>

    <div class="field">
      <label for="UserName">اسم المستخدم</label>
      <input class="in" id="UserName" name="UserName" type="text" placeholder="admin" autocomplete="username"
             data-val="true" data-val-required="اكتب اسم المستخدم">
      <span class="field-validation-valid" data-valmsg-for="UserName" data-valmsg-replace="true" asp-validation-for="UserName"></span>
    </div>

    <div class="field">
      <label for="Password">كلمة المرور</label>
      <input class="in" id="Password" name="Password" type="password" placeholder="••••" autocomplete="current-password"
             data-val="true" data-val-required="اكتب كلمة المرور">
      <span class="field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true" asp-validation-for="Password"></span>
    </div>

    <label class="check" for="RememberMe">
      <input id="RememberMe" name="RememberMe" type="checkbox" value="true" checked>
      تذكرني على الجهاز ده
    </label>
    <input name="RememberMe" type="hidden" value="false">

    <button class="btn big" type="submit">تسجيل الدخول</button>
  </form>
</main>

<script src="../js/jquery.min.js"></script>
<script src="../js/jquery.validate.min.js"></script>
<script src="../js/jquery.validate.unobtrusive.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
